name: Release

# Publishes to nuget.org when a version tag (for example v1.0.0) is pushed.
# Uses NuGet trusted publishing: no long-lived API key is stored in GitHub.

on:
  push:
    tags: ['v*']

permissions:
  contents: read
  id-token: write # required for the trusted publishing token exchange

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: nuget
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Check tag matches package version
        run: |
          version=$(dotnet msbuild src/InvoiceXml.Zugferd.XRechnung -getProperty:Version)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package version $version" >&2
            exit 1
          fi

      - name: Build
        run: dotnet build -c Release

      - name: Test
        run: dotnet test -c Release --no-build --filter "FullyQualifiedName!~Live"

      - name: Pack
        run: dotnet pack src/InvoiceXml.Zugferd.XRechnung -c Release --no-build -o artifacts

      - name: NuGet login
        id: login
        uses: NuGet/login@v1
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Push
        run: dotnet nuget push "artifacts/*.nupkg" --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json --skip-duplicate
